# ki-works.eu — Dashboard + API (Login übernimmt die App selbst)
#
# WICHTIG: Diese Datei enthält die SSL-Blöcke (Zertifikat-Pfade etc.) fest
# mit eingetragen — NICHT mehr wie früher dem Certbot-Autopatch überlassen.
# Grund: am 13.08.2026 hat ein `cp` dieser Datei auf den Server (ohne SSL-
# Zeilen) die von Certbot dort separat ergänzte HTTPS-Konfiguration
# überschrieben und die Seite für kurze Zeit offline genommen. Diese Datei
# ist jetzt die vollständige, korrekte Quelle — beim nächsten Zertifikats-
# wechsel (Domain-Änderung o. Ä.) hier direkt den neuen Pfad eintragen,
# nicht nur auf dem Server per Certbot patchen lassen.
server {
    listen 443 ssl;
    server_name ki-works.eu www.ki-works.eu;
    ssl_certificate /etc/letsencrypt/live/ki-works.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ki-works.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Firmen-Website auf der Hauptseite (Vite-Build)
    root /opt/ki-works/landing/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sales-/Social-Agent-Läufe (Websuche über mehrere Kandidaten)
        # brauchen oft deutlich länger als nginx' 60s-Standard-Timeout —
        # sonst liefert nginx nach 60s ein 504, obwohl das Backend noch
        # arbeitet (Lauf läuft serverseitig trotzdem zu Ende durch).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Kunden-Dashboard unter /dashboard
    location /dashboard {
        alias /opt/ki-works/dashboard/dist;
        try_files $uri $uri/ /dashboard/index.html;
    }

    # Internes Business-Dashboard (nur Admin) unter /intern
    location /intern {
        alias /opt/ki-works/business-dashboard/dist;
        try_files $uri $uri/ /intern/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name ki-works.eu www.ki-works.eu;
    return 301 https://$host$request_uri;
}

# n8n.ki-works.eu — Workflow-Editor
server {
    listen 443 ssl;
    server_name n8n.ki-works.eu;
    ssl_certificate /etc/letsencrypt/live/ki-works.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ki-works.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    server_name n8n.ki-works.eu;
    return 301 https://$host$request_uri;
}
