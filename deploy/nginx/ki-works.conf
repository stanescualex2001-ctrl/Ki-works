# ki-works.eu — Dashboard + API (Login übernimmt die App selbst)
#
# WICHTIG: Diese Datei enthält die SSL-Blöcke (Zertifikat-Pfade etc.) fest
# mit eingetragen — NICHT mehr wie früher dem Certbot-Autopatch überlassen.
# Grund: am 13.08.2026 hat ein `cp` dieser Datei auf den Server (ohne SSL-
# Zeilen) die von Certbot dort separat ergänzte HTTPS-Konfiguration
# überschrieben und die Seite für kurze Zeit offline genommen. Diese Datei
# ist jetzt die vollständige, korrekte Quelle — beim nächsten Zertifikats-
# wechsel (Domain-Änderung o. Ä.) hier direkt den neuen Pfad eintragen,
# nicht nur auf dem Server per Certbot patchen lassen.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ki-works.eu www.ki-works.eu;
    ssl_certificate /etc/letsencrypt/live/ki-works.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ki-works.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Firmen-Website auf der Hauptseite (Vite-Build)
    root /opt/ki-works/landing/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Sales-/Social-Agent-Läufe (Websuche über mehrere Kandidaten)
        # brauchen oft deutlich länger als nginx' 60s-Standard-Timeout —
        # sonst liefert nginx nach 60s ein 504, obwohl das Backend noch
        # arbeitet (Lauf läuft serverseitig trotzdem zu Ende durch).
        # 1800s (30 Min.) passend zum Anthropic-SDK-Timeout in
        # salesAgent.js — erst 300s, dann 1200s (08.09.2026), aber ein
        # Lauf mit Region "Wien" + 5 Kandidaten hat auch 20 Min. noch
        # überschritten (13.09.2026, echter Fehlversuch mit realen
        # Kosten) — daher jetzt 30 Min., zusätzlich maxCandidates-Default
        # von 5 auf 3 gesenkt, damit einzelne Läufe erst gar nicht mehr
        # so lange dauern.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    # Kunden-Dashboard unter /dashboard
    # Ohne explizite Cache-Header cachte der Browser gelegentlich eine
    # veraltete index.html (zeigt auf einen alten JS-Hash) und zeigte dann
    # z.B. den "Zurück zur Website"-Link wieder in DE statt der aktuell
    # gewählten Sprache — index.html daher nie cachen, die gehashten
    # Assets dagegen unbedenklich langfristig (11.10.2026). "no-cache"
    # allein reicht nicht zuverlässig (Browser können das je nach Kontext
    # ignorieren) — "no-store" verbietet das Zwischenspeichern ganz.
    location /dashboard {
        alias /opt/ki-works/dashboard/dist;
        try_files $uri $uri/ /dashboard/index.html;

        location = /dashboard/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /dashboard/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # Internes Business-Dashboard (nur Admin) unter /intern
    location /intern {
        alias /opt/ki-works/business-dashboard/dist;
        try_files $uri $uri/ /intern/index.html;

        location = /intern/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /intern/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # llms.txt braucht explizites UTF-8 im Content-Type (KI-Crawler-
    # Konvention) — nginx liefert .txt sonst ohne charset aus.
    location = /llms.txt {
        charset utf-8;
    }

    # Landingpage (ki-works.eu, /en/, /ro/ + Unterseiten): hatte bisher
    # GAR KEINE Cache-Header — der Browser durfte HTML-Seiten (inkl. dem
    # darin eingebetteten "Dashboard"-Login-Button im Header) beliebig
    # lange selbst zwischenspeichern, ohne je neu beim Server nachzufragen.
    # War die wahrscheinlichste Ursache für hartnäckige "mal geht's, mal
    # nicht"-Bugs über eine lange Browsersitzung hinweg (11.10.2026).
    location / {
        try_files $uri $uri/ /index.html;

        location ~* \.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ki-works.eu www.ki-works.eu;
    return 301 https://$host$request_uri;
}

# n8n.ki-works.eu — Workflow-Editor
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name n8n.ki-works.eu;
    ssl_certificate /etc/letsencrypt/live/ki-works.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ki-works.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name n8n.ki-works.eu;
    return 301 https://$host$request_uri;
}

# dashboard.pixelpress.at — White-Label-Zugang für die Agentur pixelpress
# (eigene Subdomain, NICHT die bloße Domain pixelpress.at — die ist die
# echte, auf einem anderen Server laufende Firmen-Website von pixelpress
# und darf hier nicht überschrieben werden). HTTP-only-Stub: certbot --nginx
# -d dashboard.pixelpress.at ergänzt automatisch den HTTPS-Block +
# ssl_certificate-Zeilen direkt in /etc/nginx/sites-available/ki-works.conf
# auf dem Server — Repo-Datei danach mit dem Server-Stand synchron halten
# (siehe CLAUDE.md "nginx/SSL"), nicht blind drüberkopieren.
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.pixelpress.at;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /dashboard {
        alias /opt/ki-works/dashboard/dist;
        try_files $uri $uri/ /dashboard/index.html;

        location = /dashboard/index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
        location /dashboard/assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location = / {
        return 301 /dashboard/;
    }
}
