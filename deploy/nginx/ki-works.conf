# ki-works.eu — Dashboard + API
server {
    listen 80;
    server_name ki-works.eu www.ki-works.eu;

    root /opt/ki-works/dashboard/dist;
    index index.html;

    # Vapi webhook: no basic auth (verified via X-Vapi-Secret in the backend)
    location /api/webhooks/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        auth_basic "ki-works";
        auth_basic_user_file /etc/nginx/ki-works.htpasswd;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        auth_basic "ki-works";
        auth_basic_user_file /etc/nginx/ki-works.htpasswd;
        try_files $uri /index.html;
    }
}

# n8n.ki-works.eu — Workflow-Editor
server {
    listen 80;
    server_name n8n.ki-works.eu;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
